spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/signalflow}
    username: ${DATABASE_USER:signalflow}
    password: ${DATABASE_PASSWORD:signalflow}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    root: INFO
    dev.signalflow: ${LOG_LEVEL:INFO}
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger{36}","correlationId":"%X{correlationId:-}","message":"%replace(%msg){''"'', ''\\"''}","exception":"%replace(%replace(%ex){''"'', ''\\"''}){''\\R'', ''\\\\n''}"}%nopex%n'
